name: Core checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: final_arrow_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d final_arrow_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/final_arrow_erp?schema=public
      DIRECT_DATABASE_URL: postgresql://erp:erp@localhost:5432/final_arrow_erp?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:api

  bootstrap-erp-database:
    name: Bootstrap authorized ERP database
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/core-auth-companies-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bootstrap-final-arrow-erp-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply migrations to the authorized ERP project
        env:
          ERP_DATABASE_URL: ${{ secrets.ERP_DATABASE_URL }}
        run: node scripts/bootstrap-erp-database.mjs
